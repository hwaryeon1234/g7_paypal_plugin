name: 문제 알리기
description: 결제가 안 되거나, 오류가 나거나, 화면이 이상할 때 알려 주세요.
title: "[문제] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        알려 주셔서 고마워요. 아래 칸을 채워 주시면 원인을 빨리 찾을 수 있어요.
        **API 키(Client ID·Secret), 구매자 이메일·주소 같은 개인정보는 적지 말아 주세요.**
  - type: textarea
    id: what
    attributes:
      label: 어떤 문제가 있나요?
      description: 무엇을 하다가 어떻게 됐는지 적어 주세요.
      placeholder: 예) USD 로 주문하고 PayPal 승인까지 했는데, 쇼핑몰로 돌아오니 "결제를 처리하지 못했어요" 가 떠요.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 어떻게 하면 똑같이 일어나나요?
      description: 순서대로 적어 주세요. 모르면 비워 두셔도 돼요.
      placeholder: |
        1. 쇼핑몰 통화를 USD 로 바꾼다
        2. 상품을 주문하고 PayPal 을 고른다
        3. ...
  - type: dropdown
    id: mode
    attributes:
      label: 샌드박스(테스트)인가요, 라이브(실결제)인가요?
      options:
        - 샌드박스(테스트)
        - 라이브(실결제)
        - 잘 모르겠어요
    validations:
      required: true
  - type: input
    id: plugin_version
    attributes:
      label: 페이팔 플러그인 버전
      description: 관리자 > 플러그인 목록에서 볼 수 있어요.
      placeholder: 예) 2.3.0
    validations:
      required: true
  - type: input
    id: g7_version
    attributes:
      label: 그누보드7 버전 / 이커머스 버전
      placeholder: 예) 7.1.5 / 1.3.4
  - type: input
    id: currency
    attributes:
      label: 주문 통화
      placeholder: 예) USD, EUR, JPY
  - type: textarea
    id: message
    attributes:
      label: 화면에 나온 오류 문구나 오류 코드
      description: 괄호 안의 영문 코드(예. CITY_REQUIRED)가 있으면 꼭 적어 주세요.
  - type: textarea
    id: log
    attributes:
      label: 서버 로그 (있으면)
      description: storage/logs/laravel.log 에서 "PayPal:" 로 시작하는 줄을 붙여 주세요. debug_id 가 있으면 PayPal 쪽에서도 추적할 수 있어요.
      render: text
