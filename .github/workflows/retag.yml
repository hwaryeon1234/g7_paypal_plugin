# 1회용 — 커밋 메시지 정리 뒤 릴리스 태그를 새 커밋으로 옮긴다. 실행 후 삭제한다.
name: 태그 재지정
on:
  push:
    branches: [main]
    paths: ['.github/workflows/retag.yml']
permissions:
  contents: write
jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 태그 이동
        run: |
          set -e
          git tag -f v1.0.2 cfca00af01fd721ede8573c96933a78b93dcfde4
          git tag -f v2.0.0 c5cf36da892505168944b01e7a1efa2c2d969ee5
          git tag -f v2.0.1 6cc0757e35d5edcc20d3a41f5d6674b34994b453
          git tag -f v2.1.0 88ba900d1c927d657413d4c0b0bffc180d3725fa
          git tag -f v2.2.0 75bca3ca49063770a45fb7420a4a7e8fbba3ff28
          git tag -f v2.2.1 365b39fea68daef853773489c161070bf907c8a3
          git tag -f v2.2.2 b28fbac9c20d10d6e33d2388ff65f3a9310bc274
          git push -f origin --tags
